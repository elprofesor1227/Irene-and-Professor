<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Big Day</title>
  <!-- Adding Google Font link -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #FFCCF9;
      margin: 0;
      padding: 2rem;
      font-family: 'Dancing Script', cursive; /* Font added here */
      color: #3a2d63;
    }

    h1 {
      text-align: center;
      font-size: 3.5em;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
    }

    .countdown-container {
      text-align: center;
      font-size: 2em;
      margin-top: 3rem;
      color: #4a3b7d;
    }

    .countdown-container span {
      font-weight: bold;
      color: #6a4b9f;
    }

    .nav-buttons {
      text-align: center;
      margin: 4rem 0 1rem;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 1rem;
      padding: 1em 2em;
      background-color: #ffffff;
      color: #6e59a7;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.2em;
      transition: background 0.3s, color 0.3s;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    .nav-buttons a:hover {
      background-color: #e9ddff;
      color: #4a3b7d;
    }

    /* Style for the 'Back to Home' button */
    .back-to-home {
      display: inline-block;
      margin-top: 2rem;
      padding: 1em 2em;
      background-color: #ffffff;
      color: #6e59a7;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.2em;
      transition: background 0.3s, color 0.3s;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    .back-to-home:hover {
      background-color: #e9ddff;
      color: #4a3b7d;
    }

  </style>
</head>
<body>

  <h1>The Big Day 💍</h1>

  <div class="countdown-container">
    <p><span id="countdown-text">Days till engagement:</span></p>
    <p id="countdown"></p>
  </div>

  <div class="nav-buttons">
    <a href="future.html" class="future-button">Letters to Future</a>
  </div>

  <!-- 'Back to Home' button -->
  <div class="nav-buttons">
    <a href="index.html" class="back-to-home">Back to Home 🏠💌</a>
  </div>

  <script>
    // Countdown to 12th May 2025, 14:00 hrs (2:00 PM)
    const countDownDate = new Date("May 12, 2025 14:00:00").getTime();

    const countdownFunction = setInterval(function() {
      const now = new Date().getTime();
      const distance = countDownDate - now;

      // Calculate days, hours, minutes, and seconds
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      // Display countdown
      document.getElementById("countdown").innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;

      // If countdown reaches 0, display message
      if (distance < 0) {
        clearInterval(countdownFunction);
        document.getElementById("countdown").innerHTML = "We're engaged!";
        document.getElementById("countdown-text").style.display = "none";
      }
    }, 1000);
  </script>

</body>
</html>
