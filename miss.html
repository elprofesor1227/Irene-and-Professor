<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>When I Miss You</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #dcd3ff;
      margin: 0;
      padding: 2rem;
      font-family: 'Dancing Script', cursive;
      color: #3a2d63;
    }

    h1 {
      text-align: center;
      font-size: 3.5em;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      font-size: 2em;
      margin-bottom: 2rem;
      color: #4a3b7d;
    }

    .glass-frame {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 2rem;
      max-width: 1000px;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin: 0 auto;
      text-align: center;
    }

    .song-grid a {
      display: block;
      text-decoration: none;
      background-color: #937eff;
      padding: 1em;
      border-radius: 15px;
      color: #ffffff;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .song-grid a:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      background-color: #7c68d1;
    }

    .song-grid.full-span {
      grid-column: span 3;
      background-color: #937eff;
      padding: 1em;
      border-radius: 15px;
      color: #ffffff;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
      text-align: center;
    }

    .song-grid.full-span:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      background-color: #7c68d1;
    }

    .miss-you-button {
      text-align: center;
      margin-top: 3rem;
    }

    .miss-you-button button {
      font-family: 'Dancing Script', cursive;
      background: linear-gradient(135deg, #ff8edb, #c68dff);
      color: white;
      font-size: 1.5em;
      padding: 1em 2.5em;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 120, 240, 0.4);
      transition: all 0.3s ease;
      position: relative;
    }

    .miss-you-button button:hover {
      background: linear-gradient(135deg, #e672ca, #a477ff);
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 120, 240, 0.6);
    }

    .nav-buttons {
      text-align: center;
      margin: 4rem 0 1rem;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 1rem;
      padding: 1em 2em;
      background-color: #ffffff;
      color: #6e59a7;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.2em;
      transition: background 0.3s, color 0.3s;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    .nav-buttons a:hover {
      background-color: #e9ddff;
      color: #4a3b7d;
    }

    /* Virtual Hugs Section */
    .virtual-hugs {
      text-align: center;
      margin-top: 3rem;
      font-size: 1.5em;
      color: #4a3b7d;
    }

    .virtual-hugs h3 {
      font-size: 2.2em;
      color: #6a4b9f;
    }

    /* Adjusted for vertical stacking with no gap */
    .virtual-hugs .hug-gifs {
      display: grid;
      grid-template-columns: 1fr; /* Stack the GIFs vertically */
      gap: 0; /* No gap between GIFs */
      justify-items: center;
    }

    .virtual-hugs .hug-gifs img {
      max-width: 100%;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .virtual-hugs .hug-gifs img:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 768px) {
      .song-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .song-grid.full-span {
        grid-column: span 2;
      }

      .virtual-hugs .hug-gifs {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {
      .song-grid {
        grid-template-columns: 1fr;
      }

      .song-grid.full-span {
        grid-column: span 1;
      }

      h1 {
        font-size: 2.5em;
      }

      .nav-buttons a {
        display: block;
        margin: 1rem auto;
        width: 80%;
      }
    }
  </style>
</head>
<body>
